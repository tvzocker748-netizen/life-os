<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>LIFE OS</title>
  <meta name="description" content="Dein persönliches Betriebssystem für Finanzen, Ziele, Gewohnheiten und Entscheidungen – offline und privat.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LIFE OS">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" aria-live="polite">
    <div class="boot">LIFE OS wird geladen …</div>
  </main>

  <nav id="tabbar" aria-label="Hauptnavigation">
    <button data-tab="heute" class="active" aria-label="Heute">
      <svg viewBox="0 0 24 24"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-5.8H9.2v5.8H5A1.5 1.5 0 0 1 3.5 19z"/></svg>
      <span>Heute</span>
    </button>
    <button data-tab="finanzen" aria-label="Finanzen">
      <svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="13.5" rx="3"/><path d="M6.5 6.5V6a2.5 2.5 0 0 1 2.5-2.5h8.5M15.5 13.2h2.5"/></svg>
      <span>Finanzen</span>
    </button>
    <button data-tab="ziele" aria-label="Ziele">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
      <span>Ziele</span>
    </button>
    <button data-tab="journal" aria-label="Journal">
      <svg viewBox="0 0 24 24"><path d="M5 19.2A2.2 2.2 0 0 1 7.2 17H19.5V3.5H7.2A2.2 2.2 0 0 0 5 5.7z"/><path d="M5 19.2a2.2 2.2 0 0 0 2.2 2.3h12.3V17"/></svg>
      <span>Journal</span>
    </button>
    <button data-tab="berichte" aria-label="Berichte">
      <svg viewBox="0 0 24 24"><path d="M3.5 20.5h17M7 16.5v-5M12 16.5V6.5M17 16.5v-8"/></svg>
      <span>Berichte</span>
    </button>
  </nav>

  <div id="lock" hidden></div>
  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tip" class="tip" hidden></div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif">LIFE OS benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.</p>
  </noscript>
  <script src="app.js" defer></script>
</body>
</html>
